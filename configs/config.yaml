# Main configuration template
# Copy to config.local.yaml and modify

# LLM configuration (optional, only needed for AI Agent CLI)
llm:
  provider: "anthropic"  # or "openai"
  model: "claude-sonnet-4-6"
  api_key: "${ANTHROPIC_API_KEY}"
  base_url: null  # use default if null

# Database configuration
database:
  path: "./data/price_monitor.db"

# Notification configuration
notification:
  wecom:
    enabled: true
    # 企业微信群机器人 Webhook
    # 获取方式: 群设置 → 群机器人 → 添加
    webhook_url: "${WECOM_WEBHOOK_URL}"
  dingtalk:
    enabled: false
    webhook_url: "${DINGTALK_WEBHOOK_URL}"

# Skills configuration
skills:
  enabled:
    - smzdm
  smzdm:
    enabled: true
    # driver: "opencli"    # 本地 Mac 用 opencli（依赖 Chrome + Browser Bridge）
    # driver: "playwright" # 无头服务器用 playwright

# Relevance filter configuration
relevance_filter:
  enabled: true  # 在 Agent 交互中启用相关性过滤（使用 LLM 判断搜索结果是否与关键词匹配）
  monitor_enabled: true  # 在后台监控中启用（配合缓存，成本可控）
  # llm:  # 可选：使用独立 LLM 配置（便宜的模型），不配置则复用主 llm
  #   provider: "openai"
  #   model: "gpt-4o-mini"
  #   api_key: "${CHEAP_LLM_API_KEY}"

