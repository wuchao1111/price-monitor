<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{{ title }} - 保价追踪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            font-size: 16px;
            touch-action: manipulation;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 12px;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 0 0 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        header h1 { font-size: 20px; font-weight: 600; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 36px;
        }
        .btn-white { background: rgba(255,255,255,0.2); color: white; }
        .btn-white:hover { background: rgba(255,255,255,0.3); }

        /* ===== Chat Messages ===== */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.2s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.agent {
            align-self: flex-start;
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .message.agent strong {
            color: #667eea;
        }
        .message.agent ul, .message.agent ol {
            margin: 6px 0;
            padding-left: 20px;
        }
        .message.agent li {
            margin: 3px 0;
        }
        .message.error {
            align-self: flex-start;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .message.system {
            align-self: center;
            background: #f3f4f6;
            color: #6b7280;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .timestamp {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
            text-align: right;
        }
        .message.agent .timestamp {
            color: #9ca3af;
        }

        /* ===== Thinking Indicator ===== */
        .thinking {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            background: white;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .thinking-dots {
            display: flex;
            gap: 4px;
        }
        .thinking-dots span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .thinking-text { color: #6b7280; font-size: 14px; }

        /* ===== Input Area ===== */
        .input-area {
            padding: 12px 0;
            flex-shrink: 0;
            background: #f5f5f5;
        }
        .input-wrapper {
            display: flex;
            gap: 8px;
            background: white;
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .input-wrapper textarea {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 12px;
            resize: none;
            line-height: 1.4;
            min-height: 48px;
            max-height: 120px;
        }
        .input-wrapper textarea::placeholder { color: #9ca3af; }
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: #667eea;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .send-btn:hover { background: #5a6fd6; }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { background: #c4c8e8; cursor: not-allowed; }

        /* ===== Suggestion Chips ===== */
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 8px 0 4px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .suggestion-chip {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid #d1d5db;
            background: white;
            color: #4b5563;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggestion-chip:hover {
            border-color: #667eea;
            color: #667eea;
            background: #f5f3ff;
        }

        @media (max-width: 768px) {
            .container { padding: 0 8px; }
            header { border-radius: 0; padding: 12px 16px; }
            header h1 { font-size: 18px; }
            .message { max-width: 92%; font-size: 15px; }
            .suggestions { display: none; }
        }

        /* Scrollbar styling */
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-track { background: transparent; }
        #chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI 助手</h1>
            <div class="header-actions">
                <button class="btn btn-white" onclick="clearChat()">清空</button>
                <a href="/" class="btn btn-white">商品列表</a>
            </div>
        </header>

        <div id="chat-messages">
            <div class="message system">你好！我是保价追踪 AI 助手。我可以帮你管理商品、查询价格、查看保价记录等。有什么需要帮忙的吗？</div>
        </div>

        <div class="suggestions" id="suggestions">
            <span class="suggestion-chip" onclick="sendSuggestion('列出所有商品')">列出所有商品</span>
            <span class="suggestion-chip" onclick="sendSuggestion('帮我添加一个商品')">添加商品</span>
            <span class="suggestion-chip" onclick="sendSuggestion('查看最近的价格记录')">价格记录</span>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" rows="1" placeholder="输入消息..." maxlength="2000"
                    onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        let isSending = false;

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function addMessage(content, type) {
            const div = document.createElement('div');
            div.className = 'message ' + type;

            // For agent messages, render newlines and bold text
            if (type === 'agent') {
                const formatted = document.createElement('div');
                formatted.style.whiteSpace = 'pre-wrap';
                formatted.style.wordWrap = 'break-word';
                // Simple markdown-like formatting
                let html = escapeHtml(content)
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
                formatted.innerHTML = html;
                div.appendChild(formatted);
            } else {
                div.textContent = content;
            }

            const ts = document.createElement('div');
            ts.className = 'timestamp';
            ts.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            div.appendChild(ts);

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showThinking() {
            const div = document.createElement('div');
            div.className = 'thinking';
            div.id = 'thinking-indicator';
            div.innerHTML = `
                <span class="thinking-text">思考中</span>
                <div class="thinking-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideThinking() {
            const el = document.getElementById('thinking-indicator');
            if (el) el.remove();
        }

        function sendSuggestion(text) {
            chatInput.value = text;
            sendMessage();
        }

        function clearChat() {
            if (!confirm('确定要清空对话记录吗？')) return;
            chatMessages.innerHTML = `
                <div class="message system">对话已清空，有什么需要帮忙的吗？</div>
            `;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isSending) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            addMessage(text, 'user');
            showThinking();

            isSending = true;
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await res.json();
                hideThinking();

                if (res.ok && data.response) {
                    addMessage(data.response, 'agent');
                } else {
                    addMessage(data.error || '请求失败，请重试', 'error');
                }
            } catch (err) {
                hideThinking();
                addMessage('网络错误，请检查服务是否正常', 'error');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                chatInput.focus();
            }
        }
    </script>
</body>
</html>
